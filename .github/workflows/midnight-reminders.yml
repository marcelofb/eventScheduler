name: Midnight Reminders

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 00:00 Argentina
  workflow_dispatch:       # permite lanzarlo manualmente para probar

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wake up Render
        run: |
          echo "Despertando servidor..."
          curl --silent --max-time 60 --retry 3 --retry-delay 10 \
            "${{ secrets.RENDER_APP_URL }}/api/health" || true
          echo "Servidor despertado"

      - name: Wait 5 minutes
        run: sleep 300

      - name: Send reminders
        run: |
          curl --fail --max-time 60 --retry 2 --retry-delay 10 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/api/check-reminders"
