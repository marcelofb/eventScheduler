name: Midnight Reminders

on:
  schedule:
    - cron: '55 2 * * *'  # 02:55 UTC = 23:55 Argentina
  workflow_dispatch:       # permite lanzarlo manualmente para probar

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Render
        run: |
          curl --silent --max-time 60 "${{ secrets.RENDER_APP_URL }}/api/health"
          echo "Servidor despertado"

      - name: Wait 5 minutes
        run: sleep 300

      - name: Send reminders
        run: |
          curl --silent --max-time 60 --fail \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/api/check-reminders"
