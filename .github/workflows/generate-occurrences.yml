name: Generate Monthly Occurrences

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

jobs:
  generate-occurrences:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wake up Render
        run: |
          curl --silent --max-time 60 --retry 3 --retry-delay 10 \
            "${{ secrets.RENDER_APP_URL }}/api/health" || true

      - name: Generate occurrences
        run: |
          curl --fail --max-time 60 --retry 2 --retry-delay 10 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/api/generate-occurrences"